<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1f2420;--muted:#6b726c;--accent:#2f8f5b;--accent2:#e8f4ec;--line:#e3e0d8;--warn:#c0492f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--card:#1e241f;--text:#eef1ee;--muted:#9aa39c;--accent:#4cc486;--accent2:#22332a;--line:#2d352f;--warn:#e8765c}}
:root[data-theme="dark"]{--bg:#141815;--card:#1e241f;--text:#eef1ee;--muted:#9aa39c;--accent:#4cc486;--accent2:#22332a;--line:#2d352f;--warn:#e8765c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:8px 0 18px}
h2{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big{font-size:44px;font-weight:700;line-height:1;color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.dots{display:flex;gap:6px;margin:12px 0}
.dot{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.dot i{display:block;height:26px;border-radius:8px;background:var(--accent2);border:1px solid var(--line);margin-bottom:3px}
.dot.on i{background:var(--accent);border-color:var(--accent)}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:var(--accent2);color:var(--text)}
button.full{width:100%}
button.small{padding:6px 10px;font-size:12px}
input{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.bar{height:16px;border-radius:99px;background:var(--accent2);overflow:hidden;margin:12px 0 6px;border:1px solid var(--line)}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .4s}
.hist{list-style:none;padding:0;margin:12px 0 0;font-size:14px}
.hist li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.neg{color:var(--warn)}
.gap{display:flex;gap:8px;margin-top:10px}
.tabs{display:flex;gap:6px;background:var(--accent2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;background:transparent;color:var(--muted)}
.tabs button.active{background:var(--accent);color:#fff}
.task{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.task label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer}
.task input[type=checkbox]{width:22px;height:22px;padding:0;flex:none;accent-color:var(--accent)}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.task .x{background:transparent;color:var(--muted);padding:4px 8px}
ul.tl{list-style:none;padding:0;margin:0}
.tabs button{padding:10px 6px;font-size:13px}
#auth{overflow:auto;position:fixed;inset:0;z-index:50;...
#auth .card{width:100%;max-width:380px;margin:0}
#auth input{margin-bottom:10px}
#amsg{color:var(--warn);font-size:13px;min-height:18px;margin-bottom:8px}
.link{background:none;color:var(--accent);padding:12px 0 0;font-weight:500;width:100%}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 12px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:60;font-size:14px}
#toast.show{display:flex}
#toast button{background:var(--accent);padding:6px 14px}
#adm{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#adm .card{max-width:480px;margin:0 auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.cal-h{text-align:center;font-size:11px;color:var(--muted)}
.cal-d{padding:0;height:36px;border-radius:10px;background:var(--accent2);color:var(--text);font-weight:500;font-size:13px;border:1px solid var(--line)}
.cal-d.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-d.today{outline:2px solid var(--accent);outline-offset:1px}
.cal-d:disabled{opacity:.35;cursor:default}
.yg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-top:12px}
.yd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.yd i{display:block;aspect-ratio:1;border-radius:2px;background:var(--accent2);border:1px solid var(--line)}
.yd i.on{background:var(--accent);border-color:var(--accent)}
.yd i.today{outline:1.5px solid var(--text)}
.title-input{font-size:20px;font-weight:700;border:0;background:transparent;padding:0;margin-bottom:4px}
</style>
</head>
<body>
<div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center">Loading…</div>
<div id="auth" style="display:none"><div class="card"><h1 style="margin-top:0">WishDays ✨</h1><div class="sub" style="margin-bottom:14px" id="asub"></div>
<button class="full ghost" id="gbtn" data-a="google">Continue with Google</button>
<div class="sub" style="text-align:center;margin:12px 0">or use email</div>
<form id="aform"><input id="auser" name="username" type="email" placeholder="Email" autocomplete="username" autocapitalize="none" inputmode="email"><input id="apass" name="password" type="password" placeholder="Password" autocomplete="current-password"><div id="amsg"></div><button class="full" id="abtn" type="submit">Log in</button></form>
<button class="link" id="aswitch" data-a="sw"></button><button class="link" style="padding-top:6px;color:var(--muted)" data-a="fp">Forgot password?</button></div></div>
<div id="adm" style="display:none"><div class="card"><div class="row"><h2 style="margin:0">🛡️ Admin</h2><button class="ghost small" data-a="ca">Close</button></div><div id="admbody"></div></div></div>
<div id="toast"></div>
<main id="app" style="display:none">
<h1>WishDays ✨</h1>
<div class="tabs"><button id="tab-days" data-a="tab" data-x="days">📅 Daily Streaks</button><button id="tab-wish" data-a="tab" data-x="wish">🎯 My Wishes</button></div>
<div id="streaks"></div><div id="wish" style="display:none"></div>
<div class="sub" style="text-align:center;margin-top:10px"><span id="who"></span><br><button id="admbtn" class="ghost small" style="display:none" data-a="oa">Admin</button> <button class="ghost small" data-a="out">Switch account</button> <button class="ghost small" data-a="out">Log out</button></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,setPersistence,browserLocalPersistence,onAuthStateChanged,signOut,GoogleAuthProvider,signInWithPopup,signInWithRedirect,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,collection,getDocs,addDoc,query,orderBy,limit,serverTimestamp,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > General > Your apps) =====
const firebaseConfig={apiKey:"PASTE_API_KEY_HERE",authDomain:"wishlist-34215.firebaseapp.com",projectId:"wishlist-34215",appId:"PASTE_APP_ID_HERE"};
const OWNER="adwaithshylesh3@gmail.com";

const $=id=>document.getElementById(id),pad=n=>n<10?"0"+n:""+n,fmt=n=>Number(n).toLocaleString();
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const back=n=>{const d=new Date();d.setDate(d.getDate()-n);return d;};
const fmtT=ts=>{try{return ts.toDate().toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}catch(e){return "never";}};
const show=w=>{$("boot").style.display=w==="boot"?"flex":"none";$("auth").style.display=w==="auth"?"flex":"none";$("app").style.display=w==="app"?"block":"none";};
function msg(t,ok){const m=$("amsg");m.textContent=t;m.style.color=ok?"var(--accent)":"";}
const EM={"auth/unauthorized-domain":"This website is not in Firebase > Authentication > Settings > Authorized domains for project wishlist-34215.","auth/invalid-credential":"Wrong email or password.","auth/wrong-password":"Wrong email or password.","auth/user-not-found":"No account with that email.","auth/email-already-in-use":"That email already has an account. Log in instead.","auth/weak-password":"Password needs at least 6 characters.","auth/popup-closed-by-user":"Sign-in was cancelled.","auth/operation-not-allowed":"This sign-in method is not turned on in Firebase > Authentication > Sign-in method.","auth/network-request-failed":"No internet connection.","auth/too-many-requests":"Too many tries. Wait a bit and try again."};
const fail=e=>msg((EM[e.code]||e.message)+" ["+(e.code||"error")+"]");

if(firebaseConfig.apiKey.startsWith("PASTE")){$("boot").textContent="Paste your Firebase config (apiKey and appId) at the top of index.html, then upload it again.";throw new Error("Firebase config missing");}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});

let me=null,isAd=false,state={streaks:[],wishes:[],trash:[]},mOff=0,yOff=0,yMode=false,mode="login",undoFn=null,tt=null;

// ---------- auth ----------
onAuthStateChanged(auth,async u=>{
  if(!u){me=null;show("auth");return;}
  try{
    const ur=doc(db,"users",u.uid),snap=await getDoc(ur),ud=snap.exists()?snap.data():{};
    if(ud.banned){await signOut(auth);show("auth");msg("This account has been banned. Contact the admin.");return;}
    me=u;isAd=(u.email===OWNER&&u.emailVerified)||ud.isAdmin===true;
    let first=false;try{first=!sessionStorage.getItem("wdl"+u.uid);sessionStorage.setItem("wdl"+u.uid,"1");}catch(e){}
    if(first||!snap.exists()){
      const data={email:u.email,name:u.displayName||"",lastLogin:serverTimestamp(),loginCount:increment(1)};
      if(!snap.exists())data.createdAt=serverTimestamp();
      await setDoc(ur,data,{merge:true});
      addDoc(collection(db,"logs"),{uid:u.uid,email:u.email,t:serverTimestamp(),ok:true}).catch(()=>{});
    }
    const ss=await getDoc(doc(db,"states",u.uid));
    state=Object.assign({streaks:[],wishes:[],trash:[]},ss.exists()?ss.data():{});
    $("who").textContent="Logged in as "+u.email;$("admbtn").style.display=isAd?"inline-block":"none";
    show("app");tab("days");
  }catch(e){show("auth");fail(e);}
});
function setMode(m){mode=m;$("abtn").textContent=m==="login"?"Log in":"Create account";$("aswitch").textContent=m==="login"?"New here? Create an account":"Have an account? Log in";$("asub").textContent=m==="login"?"Log in to continue.":"Create an account with your Gmail address.";$("apass").setAttribute("autocomplete",m==="login"?"current-password":"new-password");msg("");}
setMode("login");
$("aform").onsubmit=async ev=>{ev.preventDefault();const em=$("auser").value.trim().toLowerCase(),pw=$("apass").value;
  if(!em||!pw)return msg("Enter your email and password.");
  try{if(mode==="signup"){if(!/^[^\s@]+@gmail\.com$/.test(em))return msg("Email must end with @gmail.com");await createUserWithEmailAndPassword(auth,em,pw);}else await signInWithEmailAndPassword(auth,em,pw);}catch(e){fail(e);}};
const gp=()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});return p;};

// ---------- data ----------
const save=()=>setDoc(doc(db,"states",me.uid),state).catch(e=>toast("Could not save: "+(e.code||e.message)));
function toast(m,fn){undoFn=fn||null;const t=$("toast");t.innerHTML="<span>"+esc(m)+"</span>"+(fn?'<button data-a="undo">Undo</button>':"");t.className="show";clearTimeout(tt);tt=setTimeout(()=>{t.className="";undoFn=null;},8000);}
function streakOf(days){const s=new Set(days);let n=s.has(ds(back(0)))?0:1,c=0;while(s.has(ds(back(n)))){c++;n++;}return c;}
function tab(t){$("streaks").style.display=t==="days"?"block":"none";$("wish").style.display=t==="wish"?"block":"none";$("tab-days").className=t==="days"?"active":"";$("tab-wish").className=t==="wish"?"active":"";t==="days"?renderDays():renderWish();}
const bar=()=>`<div class="tabs" style="margin-bottom:12px"><button class="${yMode?"":"active"}" data-a="view" data-x="0">Month</button><button class="${yMode?"active":""}" data-a="view" data-x="1">Year</button></div>`;

function renderDays(){
  const t=ds(new Date()),n=new Date();
  if(yMode)return yearView(t,n);
  const f=new Date(n.getFullYear(),n.getMonth()+mOff,1),y=f.getFullYear(),mo=f.getMonth(),dim=new Date(y,mo+1,0).getDate(),pre=y+"-"+pad(mo+1)+"-";
  let h=bar()+`<div class="row" style="margin-bottom:10px"><button class="ghost small" data-a="mm" data-x="-1">‹</button><b>${f.toLocaleString([],{month:"long",year:"numeric"})}</b><button class="ghost small" data-a="mm" data-x="1" ${mOff>=0?'disabled style="opacity:.4"':""}>›</button></div><div class="sub" style="margin:0 2px 12px">Tap “Mark today as done” each day. Forgot a day? Tap it in the calendar to add it, or tap again to remove it.</div>`;
  if(!state.streaks.length)h+='<div class="card sub">Nothing here yet. Add your first tracker below.</div>';
  state.streaks.forEach((s,i)=>{
    let c="SMTWTFS".split("").map(w=>`<div class="cal-h">${w}</div>`).join("")+"<div></div>".repeat(f.getDay());
    for(let d=1;d<=dim;d++){const k=ds(new Date(y,mo,d)),on=s.days.includes(k);c+=`<button class="cal-d${on?" on":""}${k===t?" today":""}" ${k>t?"disabled":`data-a="td" data-x="${i}" data-y="${k}"`}>${d}</button>`;}
    const done=s.days.includes(t);
    h+=`<div class="card"><div class="row"><div><h2>⭐ ${esc(s.name)}</h2><div><span class="big">${streakOf(s.days)}</span> <span class="sub">day streak</span></div></div><div class="sub" style="text-align:right">This month: ${s.days.filter(x=>x.startsWith(pre)).length}<br>Total: ${s.days.length}<br><button class="ghost small" style="margin-top:6px" data-a="ds" data-x="${i}">Remove</button></div></div><div class="cal">${c}</div><button class="full${done?" ghost":""}" data-a="td" data-x="${i}" data-y="${t}">${done?"✓ Done today (tap to undo)":"Mark today as done"}</button></div>`;
  });
  h+='<div class="card"><h2>➕ Add your own</h2><div class="gap" style="margin-top:0"><input id="ntxt" placeholder="e.g. No oil, No sugar, Walk 20 min"><button data-a="as">Add</button></div></div>';
  $("streaks").innerHTML=h;
}
function yearView(t,n){
  const Y=n.getFullYear()+yOff,mn="Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
  let h=bar()+`<div class="row" style="margin-bottom:10px"><button class="ghost small" data-a="ym" data-x="-1">‹</button><b>${Y}</b><button class="ghost small" data-a="ym" data-x="1" ${yOff>=0?'disabled style="opacity:.4"':""}>›</button></div><div class="sub" style="margin:0 2px 12px">Your whole year at a glance. Tap a month name to open it and add missed days.</div>`;
  state.streaks.forEach(s=>{
    let g="";
    for(let m=0;m<12;m++){const dim=new Date(Y,m+1,0).getDate();let c='<i style="visibility:hidden"></i>'.repeat(new Date(Y,m,1).getDay()),mc=0;
      for(let d=1;d<=dim;d++){const k=ds(new Date(Y,m,d)),on=s.days.includes(k);if(on)mc++;c+=`<i class="${on?"on":""}${k===t?" today":""}"></i>`;}
      g+=`<div><button class="link" style="padding:0 0 4px;text-align:left;font-size:12px" data-a="gm" data-x="${m}">${mn[m]} · ${mc}</button><div class="yd">${c}</div></div>`;}
    h+=`<div class="card"><div class="row"><h2 style="margin:0">⭐ ${esc(s.name)}</h2><span class="sub">${s.days.filter(x=>x.startsWith(Y+"-")).length} days in ${Y}</span></div><div class="yg">${g}</div></div>`;
  });
  $("streaks").innerHTML=h;
}
function renderWish(){
  let h="";
  state.wishes.forEach((w,i)=>{
    const t=w.log.reduce((a,l)=>a+l.amt,0),p=w.target>0?Math.max(0,Math.min(100,t/w.target*100)):0;
    h+=`<div class="card"><div class="row"><h2>🎯 Wish</h2><button class="ghost small" data-a="dw" data-x="${i}">Delete</button></div><input class="title-input" value="${esc(w.name)}" data-c="wn" data-x="${i}"><div class="row"><span class="big">${fmt(t)}</span><div class="sub" style="text-align:right">of <input type="number" inputmode="numeric" value="${w.target}" data-c="wt" data-x="${i}" style="width:100px;display:inline-block;padding:6px 8px"></div></div><div class="bar"><div style="width:${p}%"></div></div><div class="sub">${t>=w.target&&w.target>0?"🎉 You reached your goal!":fmt(Math.max(0,w.target-t))+" left · "+Math.round(p)+"% saved"}</div><div class="gap"><input id="amt${i}" type="number" inputmode="numeric" placeholder="Amount"><button data-a="am" data-x="${i}" data-y="1">Add</button><button class="ghost" data-a="am" data-x="${i}" data-y="-1">Take</button></div><ul class="hist">${w.log.slice(-5).reverse().map(l=>`<li><span>${l.date}</span><span class="${l.amt<0?"neg":""}">${l.amt<0?"−":"+"}${fmt(Math.abs(l.amt))}</span></li>`).join("")}</ul>${w.log.length?`<div style="margin-top:10px"><button class="ghost small" data-a="ul" data-x="${i}">Undo last</button></div>`:""}</div>`;
  });
  h+='<div class="card"><h2>➕ Add a wish</h2><input id="wname" placeholder="Wish name (e.g. Phone)"><div class="gap"><input id="wtarget" type="number" inputmode="numeric" placeholder="Target amount"><button data-a="aw">Add</button></div></div>';
  if(state.trash.length)h+='<div class="card"><h2>🗑️ Recently deleted</h2>'+state.trash.map((w,i)=>`<div class="task"><span class="txt">${esc(w.name)} · ${fmt(w.log.reduce((a,l)=>a+l.amt,0))} saved</span><button class="ghost small" data-a="rw" data-x="${i}">Undo</button></div>`).join("")+"</div>";
  $("wish").innerHTML=h;
}

// ---------- admin ----------
async function openAdmin(){
  if(!isAd)return;
  $("adm").style.display="block";$("admbody").textContent="Loading…";
  try{
    const [us,lg]=await Promise.all([getDocs(collection(db,"users")),getDocs(query(collection(db,"logs"),orderBy("t","desc"),limit(30)))]);
    const owner=me.email===OWNER;
    let h=`<h2 style="margin-top:14px">Accounts (${us.size})</h2>`;
    us.forEach(d=>{const u=d.data(),isO=u.email===OWNER,adm=isO||u.isAdmin===true;let b="";
      if(!adm)b+=`<button class="ghost small" data-a="ban" data-x="${d.id}" data-y="${u.banned?0:1}">${u.banned?"Unban":"Ban"}</button>`;
      if(owner&&!isO)b+=`<button class="ghost small" data-a="mk" data-x="${d.id}" data-y="${u.isAdmin?0:1}">${u.isAdmin?"Remove admin":"Make admin"}</button>`;
      h+=`<div class="task"><span class="txt" style="flex:1"><b>${esc(u.email||d.id)}</b>${isO?" · owner":adm?" · admin":""}${u.banned?' · <span class="neg">banned</span>':""}<br><span class="sub">${u.loginCount||0} logins · last ${fmtT(u.lastLogin)}</span></span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${b}</span></div>`;});
    h+='<h2 style="margin-top:16px">Recent logins</h2>';
    if(lg.empty)h+='<div class="sub">No logins yet.</div>';
    lg.forEach(d=>{const l=d.data();h+=`<div class="task"><span class="txt">${esc(l.email||"")}</span><span class="sub">Logged in · ${fmtT(l.t)}</span></div>`;});
    h+='<div class="sub" style="margin-top:14px">A ban takes effect the next time that person opens the app.</div>';
    $("admbody").innerHTML=h;
  }catch(e){$("admbody").textContent="Could not load: "+(e.code||e.message)+". Check your Firestore rules.";}
}

// ---------- actions ----------
const act={
  google:async()=>{msg("");try{await signInWithPopup(auth,gp());}catch(e){fail(e);}},
  sw:()=>setMode(mode==="login"?"signup":"login"),
  fp:async()=>{const em=$("auser").value.trim().toLowerCase();if(!em)return msg("Type your email first, then tap Forgot password.");try{await sendPasswordResetEmail(auth,em);msg("Reset link sent. Check your Gmail inbox and spam.",true);}catch(e){fail(e);}},
  out:()=>signOut(auth),
  tab:x=>tab(x),
  view:x=>{yMode=x==="1";renderDays();},
  mm:x=>{mOff=Math.min(0,mOff+ +x);renderDays();},
  ym:x=>{yOff=Math.min(0,yOff+ +x);renderDays();},
  gm:x=>{mOff=Math.min(0,yOff*12+ +x-new Date().getMonth());yMode=false;renderDays();window.scrollTo(0,0);},
  td:(i,k)=>{const a=state.streaks[i].days,x=a.indexOf(k);if(x>-1)a.splice(x,1);else a.push(k);save();renderDays();},
  as:()=>{const v=$("ntxt").value.trim();if(!v)return;state.streaks.push({name:v,days:[]});save();renderDays();},
  ds:i=>{const s=state.streaks.splice(i,1)[0];save();renderDays();toast("Deleted “"+s.name+"”",()=>{state.streaks.splice(i,0,s);save();renderDays();});},
  aw:()=>{const n=$("wname").value.trim();if(!n)return;state.wishes.push({name:n,target:Math.max(0,+$("wtarget").value||0),log:[]});save();renderWish();},
  am:(i,s)=>{const a=Math.abs(+$("amt"+i).value);if(!a)return;state.wishes[i].log.push({amt:s*a,date:ds(new Date())});save();renderWish();},
  ul:i=>{state.wishes[i].log.pop();save();renderWish();},
  dw:i=>{const w=state.wishes.splice(i,1)[0];state.trash.unshift(w);state.trash=state.trash.slice(0,5);save();renderWish();toast("Deleted “"+w.name+"”",()=>{state.trash=state.trash.filter(x=>x!==w);state.wishes.splice(i,0,w);save();renderWish();});},
  rw:i=>{const w=state.trash.splice(i,1)[0];state.wishes.push(w);save();renderWish();},
  undo:()=>{if(undoFn)undoFn();undoFn=null;$("toast").className="";},
  oa:openAdmin,
  ca:()=>{$("adm").style.display="none";},
  ban:async(id,v)=>{await updateDoc(doc(db,"users",id),{banned:v==="1"});openAdmin();},
  mk:async(id,v)=>{await updateDoc(doc(db,"users",id),{isAdmin:v==="1"});openAdmin();}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&act[b.dataset.a]&&!b.disabled)act[b.dataset.a](b.dataset.x,b.dataset.y);});
document.addEventListener("change",e=>{const c=e.target.dataset.c;if(!c)return;const w=state.wishes[e.target.dataset.x];if(c==="wn"){w.name=e.target.value||"My wish";save();}if(c==="wt"){w.target=Math.max(0,+e.target.value||0);save();renderWish();}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="ntxt")act.as();if(e.target.id==="wname"||e.target.id==="wtarget")act.aw();});
</script>
</body>
